run_daily_report:
  name: Run Daily Performance Report
  description: >-
    Runs the HVAC performance agent, automatically applies supply water adjustments,
    and posts the report to Slack via the Slack Web API (bot token or webhook).
    Normally runs automatically at 7:00 AM.

set_supply_entity:
  name: Set Supply Water Heater Entity
  description: Configure which HA entity controls the supply water temperature for outdoor reset.
  fields:
    entity_id:
      name: Entity ID
      description: The entity that controls the water heater temperature (e.g., climate.tankless_water_heater, number.water_heater_setpoint, or water_heater.my_heater)
      required: true
      example: "climate.tankless_water_heater"
      selector:
        entity:

set_forecast_entity:
  name: Set Weather Forecast Entity
  description: Configure which weather entity provides hourly forecast data for predictive preheat.
  fields:
    entity_id:
      name: Entity ID
      description: A weather entity that provides hourly forecast (e.g., weather.home, weather.openweathermap)
      required: true
      example: "weather.home"
      selector:
        entity:
          domain: weather

apply_night_setback:
  name: Apply Night Setback
  description: >-
    Lower heated floor zones to night targets. Normally runs automatically after
    midnight when no first-floor or basement motion is detected.

restore_day_setback:
  name: Restore Day Setback
  description: >-
    Return zones to daytime outdoor-reset targets. Runs at 6 AM or when motion
    is detected while night mode is active.

run_hvac_orchestrator:
  name: Run HVAC Orchestrator
  description: >-
    Force an immediate HVAC mode evaluation from actual outdoor/indoor temps
    and today's forecast plan. Use after reloads or if status is stuck.

clear_cooling_pause:
  name: Clear Legacy Fan Hold
  description: >-
    Clears any leftover Hunter/Sidney fan-hold state from older versions, then
    re-runs the HVAC orchestrator. Bedroom ceiling fans are no longer automated.

step_blower_fan_speed:
  name: Step Bryant Blower Fan Speed
  description: >-
    Programs the next continuous fan speed on Bryant/Carrier variable-speed
    blowers via the thermostat toggle method: HVAC OFF + fan ON, then
    Auto→On→Auto→On within ~3 seconds per step. Leaves system OFF with fan ON
    so you can check airflow / circuit watts. Orchestrator is held so it will
    not fight the sequence. Point power_sensor at the blower circuit CT when ready.
  fields:
    steps:
      name: Speed steps
      description: How many next-speed steps to advance (1–6)
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 6
          step: 1
    climate_entity_id:
      name: Thermostat
      description: Defaults to the configured main HVAC climate entity
      required: false
      example: "climate.main_floor"
      selector:
        entity:
          domain: climate
    power_sensor:
      name: Blower power circuit
      description: >-
        Optional power sensor (W) for this run. Overrides the saved monitor for
        this call only — use set_blower_fan_power_monitor to persist it.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    settle_seconds:
      name: Settle time after each step
      description: Seconds to wait before reading power (default 8)
      required: false
      default: 8
      selector:
        number:
          min: 3
          max: 30
          step: 1
          unit_of_measurement: s
    hold_minutes:
      name: Orchestrator hold
      description: Minutes to keep orchestrator from changing HVAC mode (default 10)
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
    restore_previous:
      name: Restore previous mode
      description: If on, restore prior heat/cool/fan after programming (clears hold)
      required: false
      default: false
      selector:
        boolean:

set_blower_fan_power_monitor:
  name: Set Blower Fan Power Monitor
  description: >-
    Save which power/circuit sensor indicates continuous blower speed (watts).
    Used by step_blower_fan_speed to log before/after readings.
  fields:
    power_sensor:
      name: Power sensor
      description: Emporia/CT (or similar) on the furnace blower circuit
      required: true
      selector:
        entity:
          domain: sensor
          device_class: power

record_blower_fan_speed_calibration:
  name: Record Blower Fan Speed Calibration
  description: >-
    Save the current circuit watt reading as the Low, Medium, or High continuous
    fan speed reference (e.g. when you know the blower is on High).
  fields:
    speed:
      name: Speed
      description: Which programmed speed this reading represents
      required: true
      selector:
        select:
          options:
            - low
            - medium
            - high
    watts:
      name: Watts override
      description: Optional explicit watt value if the live sensor is lagging
      required: false
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: W

clear_blower_fan_speed_hold:
  name: Clear Blower Fan Speed Hold
  description: >-
    End the temporary orchestrator pause started by step_blower_fan_speed so
    normal HVAC automation resumes.

set_hydronic_sensors:
  name: Set Hydronic Loop Sensors
  description: Configure the supply/return water temperature sensors and flow rate sensor for the hydronic loop.
  fields:
    supply_temp_sensor:
      name: Supply Temperature Sensor
      description: Sensor entity measuring the water temperature going INTO the floor loops
      required: false
      example: "sensor.main_water_heater_outlet_temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    return_temp_sensor:
      name: Return Temperature Sensor
      description: Sensor entity measuring the water temperature coming OUT of the floor loops
      required: false
      example: "sensor.main_water_heater_inlet_temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    flow_rate_sensor:
      name: Flow Rate Sensor
      description: Sensor entity providing actual system flow rate in GPM (overrides valve-based estimation)
      required: false
      example: "sensor.main_water_heater_flow_rate"
      selector:
        entity:
          domain: sensor
