run_daily_report:
  name: Run Daily Performance Report
  description: >-
    Runs the HVAC performance agent, automatically applies supply water adjustments,
    and posts the report to Slack via the Slack Web API (bot token or webhook).
    Normally runs automatically at 7:00 AM.

set_supply_entity:
  name: Set Supply Water Heater Entity
  description: Configure which HA entity controls the supply water temperature for outdoor reset.
  fields:
    entity_id:
      name: Entity ID
      description: The entity that controls the water heater temperature (e.g., climate.tankless_water_heater, number.water_heater_setpoint, or water_heater.my_heater)
      required: true
      example: "climate.tankless_water_heater"
      selector:
        entity:

set_forecast_entity:
  name: Set Weather Forecast Entity
  description: Configure which weather entity provides hourly forecast data for predictive preheat.
  fields:
    entity_id:
      name: Entity ID
      description: A weather entity that provides hourly forecast (e.g., weather.home, weather.openweathermap)
      required: true
      example: "weather.home"
      selector:
        entity:
          domain: weather

apply_night_setback:
  name: Apply Night Setback
  description: >-
    Lower heated floor zones to night targets. Normally runs automatically after
    midnight when no first-floor or basement motion is detected.

restore_day_setback:
  name: Restore Day Setback
  description: >-
    Return zones to daytime outdoor-reset targets. Runs at 6 AM or when motion
    is detected while night mode is active.

run_hvac_orchestrator:
  name: Run HVAC Orchestrator
  description: >-
    Force an immediate HVAC mode evaluation from actual outdoor/indoor temps
    and today's forecast plan. Use after reloads or if status is stuck.

clear_cooling_pause:
  name: Clear Cooling Pause
  description: >-
    Resume cooling automations after a manual bedroom-fan pause, then re-run
    the HVAC orchestrator (allows evening heat handoff).

set_hydronic_sensors:
  name: Set Hydronic Loop Sensors
  description: Configure the supply/return water temperature sensors and flow rate sensor for the hydronic loop.
  fields:
    supply_temp_sensor:
      name: Supply Temperature Sensor
      description: Sensor entity measuring the water temperature going INTO the floor loops
      required: false
      example: "sensor.main_water_heater_outlet_temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    return_temp_sensor:
      name: Return Temperature Sensor
      description: Sensor entity measuring the water temperature coming OUT of the floor loops
      required: false
      example: "sensor.main_water_heater_inlet_temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    flow_rate_sensor:
      name: Flow Rate Sensor
      description: Sensor entity providing actual system flow rate in GPM (overrides valve-based estimation)
      required: false
      example: "sensor.main_water_heater_flow_rate"
      selector:
        entity:
          domain: sensor
