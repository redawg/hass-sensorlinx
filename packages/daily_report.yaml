# SensorLinx Daily Performance Report
# Scheduled report + Slack notification via Slack Web API (bot token or webhook)
#
# Requires scripts deployed to /config/sensorlinx/:
#   ha_daily_report_slack.py
#   daily_hvac_report.py
#   daily_report_agent.py (optional)
#
# Slack credentials on HA (one of):
#   /config/sensorlinx/slack_bot_token.txt
#   /config/sensorlinx/slack_webhook.txt
# Optional: slack_channel.txt, slack_mention.txt

shell_command:
  sensorlinx_daily_report_slack: >-
    python3 /config/sensorlinx/ha_daily_report_slack.py
    >> /config/sensorlinx/daily_report.log 2>&1

script:
  sensorlinx_daily_performance_report:
    alias: "SensorLinx: Daily Performance Report"
    description: >-
      Runs the HVAC performance agent, applies supply water adjustments automatically,
      and posts the report to Slack via the Slack Web API.
    mode: single
    sequence:
      - action: shell_command.sensorlinx_daily_report_slack

automation:
  - id: sensorlinx_daily_report_schedule
    alias: "SensorLinx: Daily Report to Slack"
    description: >-
      Runs the daily performance report every morning at 7:00 AM
      and sends results to Slack.
    mode: single
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - action: script.sensorlinx_daily_performance_report
